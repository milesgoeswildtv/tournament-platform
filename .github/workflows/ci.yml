name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck, unit, multiplayer and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Typecheck engine + worker
        run: npx tsc -p tsconfig.json --noEmit
      - name: Typecheck web (real React types)
        run: npx tsc -p web/tsconfig.json --noEmit
      - name: Unit tests (engine, games, payouts)
        run: npm run test:unit
      - name: Multiplayer integration tests (Worker + Durable Object over HTTP/WebSocket)
        run: npm run test:integration
      - name: Build web (includes the no-secrets-in-bundle check)
        run: npm run build:web
      - name: Browser end-to-end at phone size
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
          npm run test:telegram-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screens/
          if-no-files-found: ignore

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      PAGES_PROJECT: tournament-platform
      WORKER_NAME: tournament-platform-api
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set — skipping deploy. See README › Deployment."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
      - if: steps.creds.outputs.ok == 'true'
        run: npm install --no-audit --no-fund

      - name: Resolve URLs (Pages project + workers.dev subdomain)
        if: steps.creds.outputs.ok == 'true'
        id: urls
        run: |
          api() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$1"; }
          npx wrangler pages project create "$PAGES_PROJECT" --production-branch main 2>/dev/null || true
          PAGES_SUB=$(api "pages/projects/$PAGES_PROJECT" | jq -r '.result.subdomain')
          WORKERS_SUB=$(api "workers/subdomain" | jq -r '.result.subdomain')
          echo "app=https://$PAGES_SUB" >> "$GITHUB_OUTPUT"
          echo "api=https://$WORKER_NAME.$WORKERS_SUB.workers.dev" >> "$GITHUB_OUTPUT"
          echo "App: https://$PAGES_SUB   API: https://$WORKER_NAME.$WORKERS_SUB.workers.dev"

      - name: Apply D1 migrations
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply tournament-platform --remote

      - name: Deploy API Worker (+ Durable Object)
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler deploy --var "APP_URL:${{ steps.urls.outputs.app }}"

      - name: Telegram secrets + bot setup
        if: steps.creds.outputs.ok == 'true' && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          SECRET=$(printf 'webhook:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
          printf '%s' "$SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
          BOT=$(curl -fsS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getMe" | jq -r '.result.username')
          printf '%s' "$BOT" | npx wrangler secret put TELEGRAM_BOT_USERNAME
          APP_URL="${{ steps.urls.outputs.app }}" API_URL="${{ steps.urls.outputs.api }}" TELEGRAM_WEBHOOK_SECRET="$SECRET" node scripts/telegram-setup.mjs

      - name: Build and deploy web (Cloudflare Pages)
        if: steps.creds.outputs.ok == 'true'
        run: |
          VITE_API_URL="${{ steps.urls.outputs.api }}" npm run build:web
          npx wrangler pages deploy web/dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true

      - name: Verify deployment
        if: steps.creds.outputs.ok == 'true'
        run: |
          sleep 10
          curl -fsS "${{ steps.urls.outputs.api }}/api/health" | tee health.json
          jq -e '.ok == true and .env == "production"' health.json
          curl -fsS "${{ steps.urls.outputs.app }}/" | grep -q '<title>NAME TBD</title>'
          curl -fsS -o /dev/null -w '%{http_code}\n' -X OPTIONS -H "Origin: ${{ steps.urls.outputs.app }}" -H 'Access-Control-Request-Method: POST' "${{ steps.urls.outputs.api }}/api/auth/login"
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: ${{ steps.urls.outputs.app }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.urls.outputs.api }}" >> "$GITHUB_STEP_SUMMARY"
